<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>100+ AI Slop Showcases — Hyper</title>
<meta name="description" content="A catalog of 110 recognizable AI-slop patterns across code, UI, copy, architecture, and output. Each is a defect. Hyperslop detects and removes them.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&family=Plus+Jakarta+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fafaf7;--fg:#0f0f0f;--muted:#555;--accent:#d6336c;--border:#e6e6e0;--card:#fff;--bad:#c0392b;--good:#0f5132;--code:#1a1a1a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--fg);font-family:'Plus Jakarta Sans',system-ui,sans-serif;line-height:1.5}
a{color:inherit;text-decoration:none}
.container{max-width:1180px;margin:0 auto;padding:0 24px}
nav{border-bottom:1px solid var(--border);padding:18px 24px;display:flex;justify-content:space-between;align-items:center;max-width:1180px;margin:0 auto}
.logo{font-weight:600;font-size:17px}
.hero{padding:64px 0 24px}
h1{font-family:'Space Grotesk',system-ui,sans-serif;font-size:clamp(40px,6vw,64px);font-weight:700;letter-spacing:-1.5px;margin-bottom:12px}
h1 em{font-style:italic;color:var(--accent)}
.sub{color:var(--muted);font-size:17px;max-width:720px}
.count{font-family:'Space Grotesk',system-ui,sans-serif;font-size:88px;color:var(--accent);font-weight:700;line-height:1;margin-bottom:8px}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}
.toolbar input{flex:1;min-width:220px;padding:10px 14px;border:1px solid var(--border);border-radius:6px;font-size:14px;background:var(--card)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{padding:6px 12px;border:1px solid var(--border);border-radius:999px;font-size:12px;cursor:pointer;background:var(--card);transition:all .2s}
.chip:hover{border-color:var(--accent)}
.chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:24px 0}
.card{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:18px;transition:transform .2s,border-color .2s}
.card:hover{transform:translateY(-3px);border-color:var(--accent)}
.card .head{display:flex;align-items:flex-start;gap:10px;margin-bottom:8px}
.card .num{font-family:'Space Grotesk',system-ui,sans-serif;font-size:18px;color:var(--accent);font-weight:700;min-width:26px}
.card h3{font-size:14px;font-weight:600;line-height:1.3}
.card .fix{font-size:12.5px;color:var(--good);margin-top:8px;padding-top:8px;border-top:1px dashed var(--border)}
.card .fix::before{content:'Fix: ';font-weight:600}
.card .cat{font-size:10px;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-top:6px}
.demo{background:#1a1a1a;color:#e8e8e8;border-radius:8px;padding:14px;font-family:'JetBrains Mono',monospace;font-size:12px;overflow-x:auto;line-height:1.5;margin-top:10px;display:none}
.demo.show{display:block}
.demo .bad{color:#ff6b6b}
.demo .good{color:#51cf66}
.toggle{font-size:11px;color:var(--accent);cursor:pointer;margin-top:6px;display:inline-block}
.empty{padding:40px;text-align:center;color:var(--muted)}
footer{border-top:1px solid var(--border);padding:24px 0;color:var(--muted);font-size:13px;text-align:center;margin-top:24px}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<nav><div class="logo">Hyper · Slop Showcases</div><a href="index.html">← Home</a></nav>
<section class="hero"><div class="container">
<div class="count" id="count">0</div>
<h1>AI slop <em>showcases</em>.</h1>
<p class="sub">110 recognizable AI-slop patterns across code, UI, copy, architecture, and output. Each is a defect. Hyperslop detects and removes them. Search and filter below; click "show example" for a code sample.</p>
</div></section>
<div class="container">
<div class="toolbar">
  <input id="q" type="search" placeholder="Search patterns…">
  <div class="chips" id="chips"></div>
</div>
<div class="grid" id="grid"></div>
<div class="empty" id="empty" hidden>No patterns match.</div>
</div>
<footer><div class="container" id="foot"></div></footer>

<script>

["ui","No spacing scale","Define a scale.","margin:12px 7px 19px /* slop */\n/* 4/8 scale */ /* fix */"],

["ui","No i18n","Plan localization.","/* en only */ /* slop */\n/* i18n */ /* fix */"],

["ui","Overflow not handled","Define overflow behavior.","overflow:visible /* slop */\noverflow:auto /* fix */"],

["ui","No focus-visible","Visible focus states.","outline:none /* slop */\n:focus-visible{outline:2px solid} /* fix */"],
["ui","No skip link","Add skip link.","/* none */ /* slop */\n<a href='#main' class='skip'>Skip</a> /* fix */"],
["ui","No landmark regions","Use semantic landmarks.","<div class='header'> /* slop */\n<header> /* fix */"],
["ui","No alt text","Alt text for images.","<img src='x.png'> /* slop */\n<img src='x.png' alt='...'> /* fix */"],

["copy","Over-long microcopy","Cut to essentials.","'Please note that...' /* slop */\n/* cut */ /* fix */"],

["output","Restating request","Lead with result.","'Here is what I did...' /* slop */\n/* lead with result */ /* fix */"],
["output","Narrating steps","No step narration.","'Let me...' /* slop */\n/* remove */ /* fix */"],

const CATS = [
  {id:'',label:'All'},
  {id:'ui',label:'UI'},
  {id:'code',label:'Code'},
  {id:'copy',label:'Copy'},
  {id:'arch',label:'Architecture'},
  {id:'perf',label:'Perf/3D'},
  {id:'output',label:'Output'}
];
const grid = document.getElementById('grid');
const q = document.getElementById('q');
const chips = document.getElementById('chips');
const empty = document.getElementById('empty');
const count = document.getElementById('count');
const foot = document.getElementById('foot');
let activeCat = '';

function renderChips() {
  chips.innerHTML = '';
  CATS.forEach(c => {
    const b = document.createElement('button');
    b.className = 'chip' + (c.id===activeCat?' active':'');
    b.textContent = c.label;
    b.addEventListener('click', ()=>{ activeCat=c.id; renderChips(); render(); });
    chips.appendChild(b);
  });
}

function render() {
  const term = q.value.trim().toLowerCase();
  const filtered = DATA.filter(([k,name]) => (!activeCat || k===activeCat) && (!term || name.toLowerCase().includes(term) || (DATA.find(d=>d[1]===name)?.[2]||'').toLowerCase().includes(term)));
  grid.innerHTML = '';
  filtered.forEach(([k,name,fix,code],i) => {
    const el = document.createElement('article');
    el.className = 'card';
    const codeHtml = code ? `<div class="toggle" data-i="${i}">show example</div><pre class="demo" id="d${i}">${code.replace(/</g,'&lt;')}</pre>` : '';
    el.innerHTML = `<div class="head"><span class="num">${i+1}</span><h3>${name}</h3></div><div class="cat">${k}</div><div class="fix">${fix}</div>${codeHtml}`;
    grid.appendChild(el);
  });
  // wire toggles
  grid.querySelectorAll('.toggle').forEach(t => {
    t.addEventListener('click', () => {
      const d = document.getElementById('d'+t.dataset.i);
      if (d) { d.classList.toggle('show'); t.textContent = d.classList.contains('show') ? 'hide example' : 'show example'; }
    });
  });
  count.textContent = filtered.length;
  empty.hidden = filtered.length !== 0;
  foot.textContent = `${DATA.length} patterns total · Hyper · MIT`;
}
q.addEventListener('input', render);
renderChips();
render();
</script>
</body>
</html>
